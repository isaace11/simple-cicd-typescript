<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
</head>
<body>
  <h1>Calculator</h1>

  <input type="number" id="num1" placeholder="First number" />

  <select id="operation">
    <option value="sum">+</option>
    <option value="subtract">-</option>
    <option value="multiply">×</option>
    <option value="divide">÷</option>
  </select>

  <input type="number" id="num2" placeholder="Second number" />

  <button type="button" id="btnCalculate">Calculate</button>

  <p>Result: <strong id="result">—</strong></p>

  <script src="sum.js"></script>
  <script src="subtract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>

  <script>
    document.getElementById("btnCalculate").addEventListener("click", function () {
      var a = Number(document.getElementById("num1").value) || 0;
      var b = Number(document.getElementById("num2").value) || 0;
      var operation = document.getElementById("operation").value;
      var result;

      try {
        if (operation === "sum") {
          result = sum(a, b);
        } else if (operation === "subtract") {
          result = subtract(a, b);
        } else if (operation === "multiply") {
          result = multiply(a, b);
        } else if (operation === "divide") {
          result = divide(a, b);
        }

        document.getElementById("result").textContent = result;
      } catch (error) {
        document.getElementById("result").textContent = error.message;
      }
    });
  </script>
</body>
</html>
